services:
  haku:
    build:
      context: ..
    image: haku:local
    container_name: haku
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "4173"
      HAKU_PUBLIC_ORIGIN: https://mini.truesignal.cc
      HAKU_ALLOWED_ORIGINS: https://mini.truesignal.cc
      HAKU_TRUSTED_PROXY: "true"
      HAKU_DB_PATH: /var/lib/haku/haku.sqlite
    volumes:
      - /var/lib/haku:/var/lib/haku
