services:
  haku:
    build:
      context: ..
    image: haku:local
    container_name: haku
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      # 4173 is already used on the production host by oa-system-employee_web.
      # If you change this port, also change the reverse proxy target.
      PORT: "4183"
      HAKU_PUBLIC_ORIGIN: https://mini.truesignal.cc
      HAKU_ADMIN_ORIGIN: https://admin.truesignal.cc
      HAKU_ALLOWED_ORIGINS: https://mini.truesignal.cc
      HAKU_TRUSTED_PROXY: "true"
      HAKU_DB_PATH: /var/lib/haku/haku.sqlite
      HAKU_CONSENT_VERSION: 2026-10-28-v3-start-reading
    volumes:
      - /var/lib/haku:/var/lib/haku
