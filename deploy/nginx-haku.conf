# Add these blocks to active Nginx configuration only after identifying the
# current service on port 80. Do not replace the truesignal.cc HTTPS site block.

server {
    listen 80;
    listen [::]:80;
    server_name mini.truesignal.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name truesignal.cc www.truesignal.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mini.truesignal.cc;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/haku-cloudflare-realip.conf;

    location / {
        proxy_pass http://127.0.0.1:4183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}

# Keep the existing truesignal.cc HTTPS virtual host, its application routes,
# and its web root unchanged. The following is only a path placeholder:
# root /var/www/<EXISTING_TRUESIGNAL_SITE_ROOT>;
# Add the Cloudflare Origin Certificate directives to the existing HTTPS block
# to remove 525 without replacing its site-specific locations.
