# Example only. Confirm ownership and back up the existing truesignal.cc site
# and Nginx configuration before enabling this virtual host. Install an Origin
# Certificate whose SAN covers truesignal.cc and www.truesignal.cc.

server {
    listen 80;
    listen [::]:80;
    server_name truesignal.cc www.truesignal.cc;
    return 301 https://truesignal.cc$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name truesignal.cc www.truesignal.cc;

    root /var/www/truesignal/current;
    index index.html;

    ssl_certificate     /etc/ssl/cloudflare/truesignal-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/truesignal-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(?:woff2|webp|png|jpe?g|ico|svg)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires 5m;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
